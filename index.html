<style>
:root{--pink:#ff1760;--pink-light:#ff6b9c;--pink-dark:#a9003b;--bg:#100509;--text:#fff;--muted:#e2d9df}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;height:auto;margin:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
.page{position:relative;min-height:100vh;min-height:100svh;min-height:100dvh;height:auto;width:100%;display:grid;grid-template-rows:55dvh minmax(45dvh,auto);overflow:visible;isolation:isolate;background:radial-gradient(ellipse at 70% 100%,#31091d 0%,#100509 68%)}
.hero{position:relative;min-height:0;height:55dvh;overflow:hidden;background:#21130f}
.hero img{width:100%;height:100%;display:block;object-fit:cover;object-position:center top;filter:saturate(.94) contrast(1.03)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,3,7,.46),transparent 18%,rgba(16,5,9,.02) 55%,#100509 100%);pointer-events:none}
.site-header{position:absolute;z-index:3;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 9px;border-radius:18px;background:linear-gradient(90deg,rgba(12,3,8,.20),rgba(12,3,8,.04));backdrop-filter:blur(1px)}
.brand{display:flex;align-items:center;gap:8px;text-shadow:0 2px 12px rgba(0,0,0,.55)}
.heart-logo{width:clamp(39px,8vw,48px);height:clamp(39px,8vw,48px);flex:0 0 clamp(39px,8vw,48px);line-height:0;filter:drop-shadow(0 3px 5px rgba(0,0,0,.48))}.heart-logo svg{display:block;width:100%;height:100%;overflow:visible}
.brand-name{font-family:Manrope,sans-serif;font-size:clamp(22px,6.2vw,31px);font-weight:800;letter-spacing:-1.05px;line-height:1.08;white-space:nowrap;color:#fff;text-shadow:0 2px 9px rgba(0,0,0,.6)}
.brand-name .real,.brand-name .club{color:#fff;text-shadow:0 2px 9px rgba(0,0,0,.6)}.brand-name .accent{color:#ff2b70;text-shadow:none;-webkit-text-stroke:0;border:0}
.tagline{font-size:10px;letter-spacing:.1px;margin-top:3px;color:#fff;text-shadow:0 2px 6px #000}
.badge{position:relative;width:42px;height:42px;flex:0 0 42px;border:1.5px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#ff1760;background:linear-gradient(145deg,#fff 0%,#fff 58%,#ffe0eb 100%);box-shadow:inset 0 2px 3px rgba(255,255,255,.98),inset 0 -3px 5px rgba(255,23,96,.18),0 3px 7px rgba(0,0,0,.22),0 0 8px rgba(255,255,255,.28);text-shadow:0 1px 0 #fff,0 1px 2px rgba(255,23,96,.28)}
.badge:before{content:"";position:absolute;top:4px;left:7px;width:20px;height:8px;border-radius:50%;background:linear-gradient(90deg,rgba(255,255,255,.98),rgba(255,255,255,0));transform:rotate(-25deg);filter:blur(.5px)}
.content{position:relative;min-height:45dvh;height:auto;overflow:visible;padding:6px 16px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;background:linear-gradient(150deg,rgba(255,255,255,.025),transparent 35%)}
.bottom-space{display:none}
.intro{flex:0 0 auto;text-align:left}
h1{font-family:Manrope,sans-serif;font-size:clamp(27px,5.2vh,39px);font-weight:800;letter-spacing:-1.3px;line-height:1.02}
h1 span{color:var(--pink);text-shadow:0 3px 20px rgba(255,23,96,.15)}
.description{font-size:clamp(11px,1.8vh,14px);line-height:1.4;color:var(--muted);margin-top:3px;max-width:450px}
.features{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;width:100%;flex:0 0 auto}
.feature{display:flex;min-width:0;flex-direction:column;align-items:center;text-align:center;gap:5px}
.feature-icon{width:clamp(37px,6vh,49px);height:clamp(37px,6vh,49px);border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff 0%,#fff9fc 45%,#eadde4 100%);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 13px rgba(0,0,0,.3),inset 0 2px 2px rgba(255,255,255,.95),inset 0 -3px 5px rgba(177,136,157,.18)}
.glyph{position:relative;display:block;width:24px;height:24px;color:#ff1760;filter:drop-shadow(0 2px 1px rgba(130,0,45,.42))}
.glyph:before,.glyph:after{content:"";position:absolute;pointer-events:none}
.glyph-heart:before{left:3px;top:5px;width:18px;height:17px;background:linear-gradient(145deg,#ff8db2 0%,#ff2e70 32%,#ed004f 72%,#b8003e 100%);clip-path:path("M 9 17 C 7 15 0 10 0 6 C 0 0 7 -1 9 4 C 12 -1 19 0 19 6 C 19 10 12 15 9 17 Z")}
.glyph-heart:after{left:6px;top:6px;width:8px;height:4px;border-radius:50%;background:rgba(255,255,255,.8);transform:rotate(-25deg);filter:blur(.3px)}
.glyph-pin:before{left:4px;top:1px;width:17px;height:20px;border-radius:70% 70% 70% 0;background:linear-gradient(135deg,#ff9bbb,#ff2d70 45%,#d90049);transform:rotate(-45deg);box-shadow:inset 1px 1px 1px rgba(255,255,255,.75),inset -2px -2px 2px rgba(132,0,42,.28)}
.glyph-pin:after{left:9px;top:6px;width:7px;height:7px;border-radius:50%;background:linear-gradient(145deg,#fff,#f4cfdd);box-shadow:inset 0 1px 2px rgba(160,0,55,.22)}
.glyph-shield:before{left:3px;top:2px;width:19px;height:21px;background:linear-gradient(135deg,#ff9bbb 0%,#ff2d70 38%,#d90049 76%,#a9003b 100%);clip-path:polygon(50% 0,95% 18%,88% 67%,50% 100%,12% 67%,5% 18%);filter:drop-shadow(0 1px 0 #fff)}
.glyph-shield:after{left:7px;top:5px;width:1px;height:13px;background:rgba(255,255,255,.65);box-shadow:5px 1px 0 rgba(255,255,255,.15)}
.glyph-bolt:before{left:5px;top:1px;width:15px;height:22px;background:linear-gradient(135deg,#ff9bbb 0%,#ff2d70 38%,#d90049 78%,#a9003b 100%);clip-path:polygon(57% 0,10% 56%,43% 56%,31% 100%,94% 36%,60% 36%);filter:drop-shadow(0 1px 0 #fff)}
.glyph-bolt:after{left:10px;top:4px;width:3px;height:7px;border-radius:2px;background:rgba(255,255,255,.7);transform:rotate(25deg)}
.feature-label{font-size:clamp(9px,1.6vh,12px);font-weight:700;line-height:1.15;color:#fff}
.actions{width:100%;flex:0 0 auto;display:flex;flex-direction:column;gap:8px}
.continue-btn{height:clamp(48px,7.4vh,62px);width:100%;display:flex;align-items:center;justify-content:center;gap:13px;position:relative;overflow:hidden;border-radius:999px;border:1px solid #ff5489;text-decoration:none;color:#fff;font-family:Manrope,sans-serif;font-size:clamp(17px,2.8vh,22px);font-weight:800;background:linear-gradient(180deg,#ff4b8b 0%,#ff1760 38%,#e9004e 100%);box-shadow:0 7px 20px rgba(233,0,78,.32),inset 0 2px 2px rgba(255,255,255,.48),inset 0 -4px 5px rgba(105,0,37,.24)}
.continue-btn:before{content:"";position:absolute;top:2px;left:9px;right:9px;height:38%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0));pointer-events:none}
.continue-btn:active{transform:scale(.99)}
.arrow{font-size:28px;line-height:1;font-weight:400}
.trust{text-align:center;font-size:clamp(9px,1.5vh,12px);line-height:1.3;color:#f3e9ee}
.trust .dot{padding:0 8px;color:#fff}
@media(min-width:600px) and (orientation:landscape){.page{display:grid;grid-template-columns:50% 50%;grid-template-rows:100%;min-height:100vh;min-height:100dvh;height:auto}.hero{grid-column:1;grid-row:1;height:100dvh;min-height:0;}.hero:after{background:linear-gradient(90deg,rgba(10,3,7,.4),transparent 30%,#100509 100%)}.content{grid-column:2;grid-row:1;height:auto;min-height:100dvh;padding:28px clamp(20px,4vw,50px);justify-content:center;gap:clamp(12px,3vh,26px)}.bottom-space{display:none}.site-header{top:20px}.intro h1{font-size:clamp(30px,5vw,48px)}.description{font-size:clamp(12px,1.4vw,16px)}.feature-icon{width:clamp(38px,5vw,52px);height:clamp(38px,5vw,52px)}.feature-label{font-size:clamp(10px,1.2vw,13px)}.continue-btn{height:52px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Enhanced 3D pink treatment for the four feature icons only */
